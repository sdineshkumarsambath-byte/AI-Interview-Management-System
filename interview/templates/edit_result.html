<!DOCTYPE html>
<html>
<head>
    <title>Modify Interview Result</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;

            /* Background image + overlay */
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d');
            background-size: cover;
            background-position: center;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        form {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            color: #ffffff;
            position: absolute;
            top: 20px;
            width: 100%;
        }

        p {
            margin: 10px 0 5px;
            font-weight: 600;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus, select:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 5px rgba(74,144,226,0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #357abd;
        }
    </style>
</head>

<body>

<h2>✏️ Modify Interview Result</h2>

<form method="POST">
    {% csrf_token %}

    <p>Candidate Name</p>
    <input type="text" name="candidate_name" value="{{ result.resume.name }}">

    <p>Interview Date</p>
    <input type="datetime-local" name="created_at"
           value="{{ result.created_at|date:'Y-m-d\TH:i' }}">

    <p>Score</p>
    <input type="number" name="score" value="{{ result.score }}" required>

    <p>Status</p>
    <select name="status">
        <option value="Selected" {% if result.status == 'Selected' %}selected{% endif %}>Selected</option>
        <option value="Rejected" {% if result.status == 'Rejected' %}selected{% endif %}>Rejected</option>
    </select>

    <button type="submit">Update Result</button>
</form>

</body>
</html>
